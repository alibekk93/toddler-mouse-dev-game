<?xml version="1.0" encoding="UTF-8"?>
<!-- A friendly paw, not an arrow. Dark outline + light inner fill so it stays legible
     over a dark photo as well as over the background (UX §2). The hotspot is the
     visual centre of the big pad, not a tip: she aims the middle of the blob. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g stroke="#2b2118" stroke-width="4.5" stroke-linejoin="round">
    <ellipse cx="50" cy="64" rx="27" ry="24" fill="#ffd9a0"/>
    <ellipse cx="24" cy="36" rx="11" ry="13" fill="#ffd9a0"/>
    <ellipse cx="42" cy="24" rx="11" ry="14" fill="#ffd9a0"/>
    <ellipse cx="62" cy="25" rx="11" ry="14" fill="#ffd9a0"/>
    <ellipse cx="79" cy="39" rx="11" ry="13" fill="#ffd9a0"/>
  </g>
  <g fill="#e8a463" opacity="0.55">
    <ellipse cx="50" cy="70" rx="15" ry="11"/>
  </g>
</svg>
